<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='512' y2='512' gradientUnits='userSpaceOnUse'>
      <stop offset='0%' stop-color='#1e1b4b'/>
      <stop offset='100%' stop-color='#0c0a20'/>
    </linearGradient>
    <linearGradient id='fl' x1='256' y1='375' x2='256' y2='90' gradientUnits='userSpaceOnUse'>
      <stop offset='0%' stop-color='#d97706'/>
      <stop offset='55%' stop-color='#fbbf24'/>
      <stop offset='100%' stop-color='#fef9c3'/>
    </linearGradient>
    <linearGradient id='fl2' x1='256' y1='375' x2='256' y2='160' gradientUnits='userSpaceOnUse'>
      <stop offset='0%' stop-color='#f59e0b' stop-opacity='0.7'/>
      <stop offset='100%' stop-color='#fef3c7' stop-opacity='0.15'/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width='512' height='512' rx='96' fill='url(#bg)'/>

  <!-- Subtle rings -->
  <circle cx='256' cy='256' r='215' fill='none' stroke='rgba(255,255,255,0.045)' stroke-width='2'/>
  <circle cx='256' cy='256' r='200' fill='none' stroke='rgba(255,255,255,0.03)' stroke-width='1'/>

  <!-- Outer flame glow -->
  <ellipse cx='256' cy='245' rx='115' ry='148' fill='url(#fl2)' opacity='0.45'/>

  <!-- Main flame shape -->
  <path d='M256 92
    C230 125, 175 175, 172 242
    C169 305, 200 355, 256 374
    C312 355, 343 305, 340 242
    C337 175, 282 125, 256 92 Z'
    fill='url(#fl)' opacity='0.97'/>

  <!-- Inner flame (brighter core) -->
  <path d='M256 175
    C240 200, 218 228, 218 260
    C218 295, 235 320, 256 328
    C277 320, 294 295, 294 260
    C294 228, 272 200, 256 175 Z'
    fill='white' opacity='0.18'/>

  <!-- Checkmark -->
  <path d='M192 252 L238 310 L332 205'
    stroke='white' stroke-width='40' fill='none'
    stroke-linecap='round' stroke-linejoin='round'/>

  <!-- 5 habit dots at bottom -->
  <circle cx='196' cy='422' r='13' fill='#f59e0b' opacity='0.82'/>
  <circle cx='232' cy='434' r='13' fill='#f59e0b' opacity='0.82'/>
  <circle cx='270' cy='438' r='13' fill='#f59e0b' opacity='0.82'/>
  <circle cx='308' cy='434' r='13' fill='#f59e0b' opacity='0.82'/>
  <circle cx='344' cy='422' r='13' fill='#f59e0b' opacity='0.82'/>

  <!-- Sparkles -->
  <circle cx='172' cy='175' r='4' fill='white' opacity='0.35'/>
  <circle cx='150' cy='230' r='3' fill='white' opacity='0.22'/>
  <circle cx='345' cy='175' r='4' fill='white' opacity='0.35'/>
  <circle cx='367' cy='235' r='3' fill='white' opacity='0.22'/>
  <circle cx='256' cy='72' r='5' fill='white' opacity='0.4'/>
</svg>